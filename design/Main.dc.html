<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Marcellus&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ivory:#F6EFE0;
      --paper:#FBF7EC;
      --paper-edge:#EAD9AC;
      --ink:#241C12;
      --ink-soft:#5B4E39;
      --gold:#AD8A44;
      --gold-deep:#7C5A24;
      --gold-light:#E4CE97;
      --line: rgba(124,90,36,.42);
    }
    *{ box-sizing:border-box; }
    body{ margin:0; }
    a{ color:var(--gold-deep); }
    a:hover{ color:var(--gold); }
    .card{
      width:480px; height:672px;
      position:relative;
      background:linear-gradient(155deg, var(--paper) 0%, var(--ivory) 100%);
      font-family:'Cormorant Garamond', Georgia, serif;
      color:var(--ink);
      overflow:hidden;
    }
    .frame-outer{ position:absolute; inset:20px; border:1px solid var(--gold); }
    .frame-inner{ position:absolute; inset:30px; border:1px solid var(--line); }
    .corner{ position:absolute; width:34px; height:34px; }
    .corner svg{ display:block; }
    .corner.tl{ top:24px; left:24px; }
    .corner.tr{ top:24px; right:24px; transform:scaleX(-1); }
    .corner.bl{ bottom:24px; left:24px; transform:scaleY(-1); }
    .corner.br{ bottom:24px; right:24px; transform:scale(-1,-1); }
    .content{
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center;
      padding:0 62px;
    }
    .seal{
      width:66px; height:66px; border-radius:50%;
      background:radial-gradient(circle at 32% 30%, var(--gold-light), var(--gold) 55%, var(--gold-deep) 100%);
      border:1px solid var(--gold-deep);
      display:flex; align-items:center; justify-content:center;
      font-family:'Marcellus', serif; font-size:22px; color:var(--paper);
      box-shadow:0 8px 16px -8px rgba(53,38,9,.35), inset 0 0 0 3px rgba(255,255,255,.18);
      margin-bottom:20px;
    }
    .eyebrow{
      font-family:'Jost', sans-serif; font-weight:600;
      font-size:13px; letter-spacing:4.5px; text-transform:uppercase;
      color:var(--ink-soft); margin-bottom:14px;
    }
    .who{
      font-size:46px; font-weight:500; line-height:1.14;
      margin:0;
    }
    .line{
      font-style:italic; font-size:17px; color:var(--ink-soft);
      margin-top:14px; max-width:300px;
    }
    .flourish{ display:flex; align-items:center; gap:10px; margin:22px 0; }
    .fl-line{ width:52px; height:1px; }
    .fl-line.l{ background:linear-gradient(90deg, transparent, var(--gold)); }
    .fl-line.r{ background:linear-gradient(90deg, var(--gold), transparent); }
    .fl-dot{ width:6px; height:6px; background:var(--gold); transform:rotate(45deg); }
    .date{ font-size:19px; letter-spacing:.3px; }
    .venue{ margin-top:8px; font-style:italic; font-size:15px; color:var(--ink-soft); }
  </style>
</helmet>

<div class="card">
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <div class="corner tl">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M2 32 C2 32 2 12 17 10 C26 9 28 3 28 3" stroke="#AD8A44" stroke-width="1.2"/>
      <circle cx="28" cy="3" r="2" fill="#AD8A44"/>
    </svg>
  </div>
  <div class="corner tr">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M2 32 C2 32 2 12 17 10 C26 9 28 3 28 3" stroke="#AD8A44" stroke-width="1.2"/>
      <circle cx="28" cy="3" r="2" fill="#AD8A44"/>
    </svg>
  </div>
  <div class="corner bl">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M2 32 C2 32 2 12 17 10 C26 9 28 3 28 3" stroke="#AD8A44" stroke-width="1.2"/>
      <circle cx="28" cy="3" r="2" fill="#AD8A44"/>
    </svg>
  </div>
  <div class="corner br">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
      <path d="M2 32 C2 32 2 12 17 10 C26 9 28 3 28 3" stroke="#AD8A44" stroke-width="1.2"/>
      <circle cx="28" cy="3" r="2" fill="#AD8A44"/>
    </svg>
  </div>

  <div class="content">
    <div class="seal">YN</div>
    <div class="eyebrow">Please join us</div>
    <h1 class="who">Yehoshua<br>Norowitz</h1>
    <p class="line">as he is called to the Torah as a Bar Mitzvah</p>
    <div class="flourish">
      <span class="fl-line l"></span>
      <span class="fl-dot"></span>
      <span class="fl-line r"></span>
    </div>
    <p class="date">Motzei Shabbos, 26th of Cheshvan &middot; November 7, 2026</p>
    <p class="venue">Details on reverse</p>
  </div>
</div>
</x-dc>
</body>
</html>
